name: wtg-spain-api

services:
  app: &app
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: housing_api
      DB_USERNAME: root
      DB_PASSWORD: ''
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '127.0.0.1:${APP_PORT:-8088}:8000'
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *app
    ports: []
    command: ['php', 'artisan', 'queue:work', 'redis', '--queue=imports', '--tries=1', '--timeout=60']
    restart: unless-stopped
    stop_grace_period: 70s

  scheduler:
    <<: *app
    ports: []
    command: ['php', 'artisan', 'schedule:work']
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: housing_api
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  vendor_data:
